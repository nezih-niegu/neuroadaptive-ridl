[project]
name = "neuroadaptive-ridl"
version = "0.1.0"
description = "Cognitive equivalence of VR-haptic surgical teleoperation and a hierarchical diffusion-RL agent (RIDL) trained on EEG-annotated demonstrations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nezih Nieto Gutiérrez" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # core scientific stack
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "tqdm>=4.66",
    "pillow>=10.0",
    # deep learning / diffusion (frozen SD-v1.5 UNet)
    "torch>=2.7",
    "torchvision>=0.22",
    "diffusers>=0.33",
    "accelerate>=1.7",
    "transformers>=4.40",
    "gymnasium>=1.1",
    "opencv-python>=4.11",
    # statistics for the Frontiers analyses
    "scikit-learn>=1.6",
    "statsmodels>=0.14",
    "pingouin>=0.5.5",
    "kaleido==0.2.1",
    "plotly>=5.20,<6",
]

[project.optional-dependencies]
# legacy real-time PPO-vs-RIDL viewers in thesis/
viewer = ["vispy>=0.14", "glfw>=2.7"]
# notebooks/
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "plotly>=5.20"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ridl"]
